<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hasil Scan QR - TEMANK3</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: #194b76;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loading.hide {
      opacity: 0;
      visibility: hidden;
    }

    #loading img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      background: #194b76;
      display: flex;
      align-items: center;
      z-index: 1000;
      color: white;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    .back-button {
      width: 65px;
      height: 75px;
      border: none;
      background: transparent;
      color: white;
      font-size: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .header-title {
      font-size: 22px;
      font-weight: bold;
    }

    /* =========================
       BIODATA
    ========================= */

    .biodata {
      width: 100%;
      background: #ffffff;
      min-height: 200px;
    }

    .biodata img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      margin: 0 auto;
    }

    /* =========================
       DATA TIDAK DITEMUKAN
    ========================= */

    #notFound {
      display: none;
      text-align: center;
      padding: 60px 20px;
      color: #555;
      font-size: 18px;
    }

    #notFound.show {
      display: block;
    }

    /* =========================
       FOOTER LOGO
    ========================= */

    .footer {
      width: 100%;
      background: #194b76;
      padding: 30px 15px;
    }

    .footer-logos {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 30px;
      flex-wrap: wrap;
    }

    .footer-logos img {
      width: 150px;
      height: 100px;
      object-fit: contain;
      display: block;
    }

    /* =========================
       HP
    ========================= */

    @media (max-width: 600px) {

      .header {
        height: 65px;
      }

      .back-button {
        width: 55px;
        height: 65px;
        font-size: 32px;
      }

      .header-title {
        font-size: 18px;
      }

      .footer {
        padding: 25px 10px;
      }

      .footer-logos {
        gap: 10px;
      }

      .footer-logos img {
        width: 70px;
        height: 70px;
      }
    }

    /* =========================
       HP KECIL
    ========================= */

    @media (max-width: 380px) {

      .header-title {
        font-size: 16px;
      }

      .footer-logos {
        gap: 5px;
      }

      .footer-logos img {
        width: 65px;
        height: 65px;
      }
    }
  </style>
</head>


<body>

  <!-- =========================
       LOADING
  ========================= -->

  <div id="loading">
    <img src="loading.jpg" alt="Loading">
  </div>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="header">

    <button
      class="back-button"
      onclick="kembali()"
      aria-label="Kembali">
      ‹
    </button>

    <div class="header-title">
      Hasil Scan QR
    </div>

  </header>


  <!-- =========================
       BIODATA
  ========================= -->

  <main class="biodata">

    <img
      id="biodataImage"
      src=""
      alt="Biodata Personil">

    <div id="notFound">
      Data personil tidak ditemukan.
    </div>

  </main>


  <!-- =========================
       FOOTER 4 LOGO
  ========================= -->

  <footer class="footer">

    <div class="footer-logos">

      <img
        src="k3-keselamatan-logo.png"
        alt="Utamakan Keselamatan dan Kesehatan Kerja">

      <img
        src="tangan-k3.png"
        alt="Logo K3">

      <img
        src="K3-Unggul-Indonesia-Maju..png"
        alt="K3 Unggul Indonesia Maju">

      <img
        src="Fin_logo_g20-01.png"
        alt="G20 Indonesia 2022">

    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    /* =========================
       BACA ID DARI URL
       Contoh:
       ?id=001
       ?id=002
       ?id=003
    ========================= */

    const parameter =
      new URLSearchParams(window.location.search);

    let nomor =
      parameter.get("id") || "001";

    let angka =
      parseInt(nomor);


    /* =========================
       BATAS DATA 001 - 1000
    ========================= */

    if (
      !isNaN(angka) &&
      angka >= 1 &&
      angka <= 1000
    ) {

      nomor =
        String(angka).padStart(3, "0");

    } else {

      nomor = "001";

    }


    /* =========================
       TAMPILKAN GAMBAR BIODATA
    ========================= */

    const gambar =
      document.getElementById("biodataImage");

    const notFound =
      document.getElementById("notFound");


    gambar.src =
      nomor + ".jpg";


    /* =========================
       JIKA GAMBAR TIDAK ADA
    ========================= */

    gambar.onerror = function () {

      gambar.style.display = "none";

      notFound.classList.add("show");

    };


    /* =========================
       TOMBOL KEMBALI
    ========================= */

function kembali() {
  window.location.href = "https://kemnaker.go.id/";
}


    /* =========================
       HILANGKAN LOADING
       SETELAH 1,8 DETIK
    ========================= */

    window.addEventListener(
      "load",
      function () {

        setTimeout(
          function () {

            document
              .getElementById("loading")
              .classList.add("hide");

          },
          1800
        );

      }
    );

  </script>

</body>
</html>
