<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hasil Scan QR</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: white;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   LOADING
========================= */

#loading {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #194b76;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.4s ease;
}

#loading img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

#loading.hide {
    opacity: 0;
    pointer-events: none;
}


/* =========================
   HEADER
========================= */

.header {
    height: 85px;
    background: #194b76;
    color: white;

    display: flex;
    align-items: center;

    padding: 0 20px;

    gap: 15px;

    position: sticky;
    top: 0;

    z-index: 100;
}

.back {
    border: none;
    background: none;

    color: white;

    font-size: 44px;
    line-height: 1;

    cursor: pointer;

    width: 40px;
}

.header-title {
    font-size: 30px;
    font-weight: bold;
}


/* =========================
   BIODATA
========================= */

.biodata {
    width: 100%;
    background: white;
}

.biodata img {
    width: 100%;
    height: auto;

    display: block;

    margin: 0;
}


/* =========================
   DATA TIDAK ADA
========================= */

.not-found {
    display: none;

    padding: 80px 20px;

    text-align: center;

    font-size: 22px;
    font-weight: bold;

    color: #194b76;
}


/* =========================
   FOOTER
========================= */

.footer {
    min-height: 190px;

    background: #194b76;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    color: white;

    padding: 30px 20px;
}

.footer-logo {
    font-size: 38px;
    font-weight: bold;
}

.footer-logo span {
    color: #39ff00;
}

.footer-text {
    margin-top: 10px;

    font-size: 18px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .header {
        height: 75px;
        padding: 0 15px;
    }

    .back {
        font-size: 40px;
        width: 35px;
    }

    .header-title {
        font-size: 27px;
    }

    .footer {
        min-height: 160px;
    }

    .footer-logo {
        font-size: 30px;
    }

    .footer-text {
        font-size: 15px;
    }
}
</style>
</head>


<body>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <img
        src="loading.jpg"
        alt="Loading Teman K3"
    >

</div>



<!-- =========================
     HEADER
========================= -->

<header class="header">

    <button
        class="back"
        onclick="kembali()"
        aria-label="Kembali"
    >
        ‹
    </button>

    <div class="header-title">
        Hasil Scan QR
    </div>

</header>



<!-- =========================
     BIODATA
========================= -->

<main class="biodata">

    <img
        id="biodataImage"
        alt="Biodata Personil"
    >

    <div
        id="notFound"
        class="not-found"
    >
        Data personil tidak ditemukan.
    </div>

</main>



<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

    <div>

        <div class="footer-logo">
            TEMAN<span>K3</span>
        </div>

        <div class="footer-text">
            Pelayanan Keselamatan dan Kesehatan Kerja
        </div>

    </div>

</footer>



<script>

/* =========================
   NOMOR PERSONIL
========================= */

const parameter =
    new URLSearchParams(window.location.search);

let nomor =
    parameter.get("id") || "001";


/*
   Mengubah:

   1    → 001
   2    → 002
   10   → 010
   100  → 100
*/

let angka = parseInt(nomor);

if (
    !isNaN(angka) &&
    angka >= 1 &&
    angka <= 1000
) {

    nomor =
        String(angka).padStart(3, "0");

} else {

    nomor = "001";

}


/* =========================
   TAMPILKAN GAMBAR
========================= */

const gambar =
    document.getElementById("biodataImage");

const notFound =
    document.getElementById("notFound");


gambar.src =
    nomor + ".jpg";


/* Kalau gambar tidak ada */

gambar.onerror = function() {

    gambar.style.display = "none";

    notFound.style.display = "block";

    notFound.innerHTML =
        "Data personil " +
        nomor +
        " belum tersedia.";

};


/* =========================
   TOMBOL KEMBALI
========================= */

function kembali() {

    if (window.history.length > 1) {

        window.history.back();

    } else {

        window.location.href = "./";

    }

}


/* =========================
   LOADING
========================= */

window.addEventListener(
    "load",
    function() {

        setTimeout(
            function() {

                document
                    .getElementById("loading")
                    .classList.add("hide");

            },
            1800
        );

    }
);

</script>

</body>
</html>
